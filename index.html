<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Card</title>
<!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Arial', sans-serif;
    background: #e0e0e0;
  }

  .card {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    width: 450px;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    text-align: center;
    padding: 40px 30px;
    color: white;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }

  .profile-img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
    border: 4px solid white;
  }

  .name {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .role {
    color: #f0f0f0;
    font-size: 18px;
    margin-bottom: 25px;
  }

  .social-icons {
    display: flex;
    justify-content: center;
    gap: 30px;
  }

  .social-icons a {
    color: white;
    font-size: 26px;
    transition: transform 0.3s, color 0.3s;
  }

  .social-icons a:hover {
    color: #ffd700; /* hover color */
    transform: scale(1.3);
  }
</style>
</head>
<body>

<div class="card">
  <img src="rajee.jpg" alt="Profile" class="profile-img">
  <div class="name">Rajeshwari C</div>
  <div class="role">Frontend Developer</div>

  <div class="social-icons">
    <a href="https://www.linkedin.com/in/rajeshwari-c-66a323372/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
    <a href="https://github.com/rajeshwari69514-boop" target="_blank"><i class="fab fa-github"></i></a>
    <a href="#" target="_blank"><i class="fab fa-instagram"></i></a> <!-- Add Instagram link -->
  </div>
</div>

</body>
</html>
